[project]
name = "corporate-data-chat-backend"
version = "0.1.0"
description = "FastAPI backend for a corporate AI data-chat application over SQLite and Excel sources."
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20.0",
  "duckdb>=1.0.0",
  "fastapi>=0.115.0",
  "greenlet>=3.0.0",
  "httpx>=0.27.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "numpy>=1.26.0",
  "openai>=1.40.0",
  "openpyxl>=3.1.0",
  "orjson>=3.10.0",
  "pandas>=2.2.0",
  "plotly>=5.23.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.18",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.32",
  "sqlglot>=25.0.0",
  "tenacity>=8.5.0",
  "uvicorn[standard]>=0.30.0",
  "xlrd>=2.0.1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
